<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>НЕ ОТПРАВЛЯЙТЕ</title>
  <link rel="stylesheet" href="styles.css?v=19" />
</head>
<body>
  <div class="cabinet">
    <header class="marquee">
      <span>ORION TECH</span>
      <span>RETAIL GATE</span>
      <span>NO SPAM ZONE</span>
    </header>
    <div class="bezel">
      <canvas id="game" width="480" height="270" aria-label="Игровая сцена"></canvas>
      <div class="crt" aria-hidden="true"></div>
    </div>
    <div class="deck">
      <button id="soundBtn" class="cab-btn cab-small" type="button">SOUND ON</button>
      <button id="blockBtn" class="cab-btn cab-block" type="button"><b>A</b> НЕ ОТПРАВЛЯТЬ</button>
      <button id="sendBtn" class="cab-btn cab-send" type="button"><b>D</b> ОТПРАВИТЬ</button>
      <button id="fullBtn" class="cab-btn cab-small" type="button">FULL</button>
    </div>
  </div>
  <script src="app.js?v=19"></script>
</body>
</html>
